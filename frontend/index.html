<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CatchMail — Never miss a task hidden in an email</title>
    <meta
      name="description"
      content="CatchMail scans your Gmail inbox with AI, finds the tasks and deadlines hidden in your emails, and turns them into a clean to-do list — with one click to push it all into Google Calendar."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="CatchMail — Never miss a task hidden in an email" />
    <meta
      property="og:description"
      content="CatchMail scans your Gmail inbox with AI, finds the tasks and deadlines hidden in your emails, and turns them into a clean to-do list."
    />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CatchMail — Never miss a task hidden in an email" />
    <meta
      name="twitter:description"
      content="CatchMail scans your Gmail inbox with AI and turns hidden tasks into a clean to-do list."
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f172a'/%3E%3Cpath d='M4 7h16v11H4z' stroke='white' stroke-width='1.6' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M4 8l8 6 8-6' stroke='white' stroke-width='1.6' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E"
    />

    <script>
      // Applied before React mounts so there's no flash of the wrong theme.
      (function () {
        var stored = localStorage.getItem('theme');
        var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
